<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Registration Form</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="left-panel">
        <div class="content">
            <h1>Create Your Account</h1>

            <p>
                Join thousands of users and experience a modern platform
                designed for speed, security and simplicity.
            </p>

            <div class="features">
                <div class="feature">✓ Secure Registration</div>
                <div class="feature">✓ Modern User Interface</div>
                <div class="feature">✓ Fully Responsive</div>
                <div class="feature">✓ Fast & Reliable</div>
            </div>
        </div>
    </div>

    <div class="right-panel">

        <div class="form-card">

            <h2>Registration Form</h2>

            <form>

                <div class="input-box">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name">
                </div>

                <div class="input-box">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="row">

                    <div class="input-box">
                        <label>Mobile Number</label>
                        <input type="tel" placeholder="Enter mobile number">
                    </div>

                    <div class="input-box">
                        <label>Date of Birth</label>
                        <input type="date">
                    </div>

                </div>

                <div class="row">

                    <div class="input-box">
                        <label>Password</label>
                        <input type="password" placeholder="Create password">
                    </div>

                    <div class="input-box">
                        <label>Confirm Password</label>
                        <input type="password" placeholder="Confirm password">
                    </div>

                </div>

                <div class="gender-box">

                    <label class="title">Gender</label>

                    <div class="gender-options">

                        <label class="gender-card">
                            <input type="radio" name="gender">
                            <span>Male</span>
                        </label>

                        <label class="gender-card">
                            <input type="radio" name="gender">
                            <span>Female</span>
                        </label>

                        <label class="gender-card">
                            <input type="radio" name="gender">
                            <span>Other</span>
                        </label>

                    </div>

                </div>

                <div class="input-box">
                    <label>Address</label>
                    <textarea placeholder="Enter your address"></textarea>
                </div>

                <div class="row">

                    <div class="input-box">
                        <label>Country</label>

                        <select>
                            <option>India</option>
                            <option>USA</option>
                            <option>Canada</option>
                            <option>Australia</option>
                        </select>
                    </div>

                    <div class="input-box">
                        <label>Postal Code</label>
                        <input type="text" placeholder="Postal code">
                    </div>

                </div>

                <button type="submit">
                    Create Account
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
